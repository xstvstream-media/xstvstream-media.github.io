<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Encurtador de Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d10;
            --card-bg: #12151a;
            --input-bg: #181c22;
            --border: rgba(255, 255, 255, .08);
            --border-strong: rgba(255, 255, 255, .16);
            --text-main: #f2f4f7;
            --text-muted: #8a909d;
            --accent: #16d16b;
            --accent-hover: #2ee881;
            --accent-press: #0fb95c;
            --error: #f87171;
            --success: #2ee881;
            --radius-s: 12px;
            --radius-m: 20px;
            --radius-l: 28px;
            --ease: cubic-bezier(.2, 0, 0, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(ellipse 70% 45% at 12% -5%, rgba(22, 209, 107, .10), transparent 60%),
                radial-gradient(ellipse 60% 40% at 92% 8%, rgba(59, 130, 246, .07), transparent 55%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            animation: pageIn .5s var(--ease) both;
        }

        @keyframes pageIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #redirectScreen {
            display: none;
            text-align: center;
        }

        .spinner {
            width: 46px;
            height: 46px;
            border: 4px solid rgba(255, 255, 255, .08);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 22px auto;
            box-shadow: 0 0 24px rgba(22, 209, 107, .25);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 540px;
            animation: riseIn .55s var(--ease) .05s both;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 34px;
        }

        header h1 {
            font-weight: 800;
            font-size: 2.1rem;
            letter-spacing: -1px;
        }

        header h1 span {
            background: linear-gradient(92deg, #ffffff 20%, #7ce8ae 70%, #16d16b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        header p {
            color: var(--text-muted);
            font-size: .9rem;
            margin-top: 8px;
            font-weight: 500;
        }

        .card {
            background: linear-gradient(160deg, #161a20, #101318);
            border: 1px solid var(--border);
            border-radius: var(--radius-l);
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: .72rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 9px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px 17px;
            border-radius: 16px;
            font-size: .95rem;
            transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(22, 209, 107, .12);
        }

        .input-prefix-container {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
        }

        .input-prefix-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(22, 209, 107, .12);
        }

        .prefix {
            padding-left: 16px;
            color: var(--text-muted);
            font-size: .85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .input-prefix-container input {
            border: none;
            background: transparent;
            padding-left: 6px;
            box-shadow: none !important;
        }

        button.btn-primary {
            position: relative;
            overflow: hidden;
            width: 100%;
            background: linear-gradient(145deg, #1ee87e, #0fbf5e);
            color: #04130a;
            border: none;
            padding: 16px;
            border-radius: 999px;
            font-family: inherit;
            font-size: .95rem;
            font-weight: 800;
            letter-spacing: .2px;
            cursor: pointer;
            transition: transform .15s var(--ease), box-shadow .25s var(--ease), opacity .2s;
            margin-top: 8px;
            box-shadow: 0 6px 18px rgba(22, 209, 107, .35), inset 0 1px 0 rgba(255,255,255,.3);
        }

        button.btn-primary:hover:not(:disabled) {
            box-shadow: 0 8px 26px rgba(22, 209, 107, .5), inset 0 1px 0 rgba(255,255,255,.3);
        }

        button.btn-primary:active:not(:disabled) {
            transform: scale(.96);
        }

        button.btn-primary:disabled {
            opacity: .45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-area {
            margin-top: 26px;
            display: none;
            animation: fadeIn .35s var(--ease) both;
        }

        .result-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(46, 232, 129, .07);
            border: 1px solid rgba(46, 232, 129, .25);
            padding: 13px 14px 13px 17px;
            border-radius: 18px;
            gap: 12px;
        }

        .short-url {
            color: var(--success);
            font-weight: 600;
            text-decoration: none;
            font-size: .9rem;
            word-break: break-all;
        }

        .short-url:hover { text-decoration: underline; }

        .btn-copy {
            background: transparent;
            border: 1px solid rgba(46, 232, 129, .5);
            color: var(--success);
            font-family: inherit;
            padding: 9px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: .78rem;
            font-weight: 800;
            white-space: nowrap;
            transition: all .2s var(--ease);
        }

        .btn-copy:hover {
            background: var(--success);
            color: #04130a;
        }

        .btn-copy:active { transform: scale(.93); }

        .msg-erro {
            color: var(--error);
            font-size: .82rem;
            font-weight: 600;
            margin-top: 9px;
            display: none;
        }

        .history {
            margin-top: 40px;
        }

        .history h3 {
            font-size: .72rem;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            background: linear-gradient(160deg, #14181d, #0f1216);
            border: 1px solid var(--border);
            padding: 15px 16px;
            border-radius: 20px;
            margin-bottom: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: border-color .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);
        }

        .history-item:hover {
            border-color: var(--border-strong);
            transform: translateY(-2px);
            box-shadow: 0 10px 26px rgba(0,0,0,.35);
        }

        .history-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .history-short {
            background: linear-gradient(92deg, #ffffff 30%, #7ce8ae);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
            font-size: .88rem;
            font-weight: 700;
        }

        .history-long {
            color: var(--text-muted);
            font-size: .78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::selection {
            background: rgba(22, 209, 107, .3);
            color: #fff;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: #252b34;
            border-radius: 8px;
            border: 2px solid var(--bg-color);
        }
    </style>
</head>
<body>

    <!-- Tela de Redirecionamento -->
    <div id="redirectScreen">
        <div class="spinner"></div>
        <h2 id="redirectMsg" style="font-weight: 500; font-size: 1.1rem;">Redirecionando...</h2>
    </div>

    <!-- Interface Principal do Usuário -->
    <div class="container" id="mainContainer">
        <header>
            <h1>NEXUS<span>Links</span></h1>
            <p>Encurtador de links profissional</p>
        </header>

        <div class="card">
            <form id="shortenForm">
                <div class="form-group">
                    <label for="longUrl">URL Original</label>
                    <input type="url" id="longUrl" placeholder="https://seu-link-original.com/pagina" required>
                </div>

                <div class="form-group">
                    <label for="customAlias">Nome Personalizado (Opcional)</label>
                    <div class="input-prefix-container">
                        <span class="prefix" id="domainPrefix">.../?l=</span>
                        <input type="text" id="customAlias" placeholder="meu-nome">
                    </div>
                    <div id="errorMsg" class="msg-erro">Este nome personalizado já está em uso ou foi bloqueado!</div>
                </div>

                <button type="submit" class="btn-primary" id="btnSubmit">Encurtar Link</button>
            </form>

            <div class="result-area" id="resultArea">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--text-muted);">SEU LINK ENCURTADO:</label>
                <div class="result-box">
                    <a href="#" target="_blank" class="short-url" id="shortUrlDisplay"></a>
                    <button class="btn-copy" id="copyBtn" onclick="copyLink()">Copiar</button>
                </div>
            </div>
        </div>

        <div class="history">
            <h3>Seus Links Recentes</h3>
            <ul class="history-list" id="historyList">
                <p style="color: var(--text-muted); font-size: 0.85rem;">Nenhum link criado ainda por você neste navegador.</p>
            </ul>
        </div>
    </div>

    <script>
        const DB_URL = "https://meu-encurtador-e5878-default-rtdb.firebaseio.com";
        const currentDomain = window.location.origin + window.location.pathname;
        document.getElementById('domainPrefix').textContent = window.location.hostname + '/?l=';

        // Identificador local do dispositivo do usuário (para registrar quem criou)
        let localUserId = localStorage.getItem('nexus_user_id');
        if (!localUserId) {
            localUserId = 'user_' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('nexus_user_id', localUserId);
        }

        // REDIRECIONAMENTO
        const urlParams = new URLSearchParams(window.location.search);
        const aliasParam = urlParams.get('l');

        if (aliasParam) {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('redirectScreen').style.display = 'block';

            fetch(`${DB_URL}/links/${aliasParam.toLowerCase()}.json`)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data && data.originalUrl && !data.blocked) {
                        // Incrementa cliques se o link for válido
                        const clicks = (data.clicks || 0) + 1;
                        fetch(`${DB_URL}/links/${aliasParam.toLowerCase()}/clicks.json`, {
                            method: 'PUT',
                            body: JSON.stringify(clicks)
                        });
                        window.location.href = data.originalUrl;
                    } else if (data && data.blocked) {
                        document.querySelector('.spinner').style.display = 'none';
                        document.getElementById('redirectMsg').textContent = 'Este link foi suspenso por violar os termos de uso.';
                    } else {
                        document.querySelector('.spinner').style.display = 'none';
                        document.getElementById('redirectMsg').textContent = 'Link não encontrado!';
                    }
                })
                .catch(() => {
                    document.querySelector('.spinner').style.display = 'none';
                    document.getElementById('redirectMsg').textContent = 'Erro de conexão com o servidor.';
                });
        }

        // ENCURTAR LINK
        document.getElementById('shortenForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const longUrl = document.getElementById('longUrl').value.trim();
            let customAlias = document.getElementById('customAlias').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');
            const errorMsg = document.getElementById('errorMsg');

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Encurtando...';
            errorMsg.style.display = 'none';

            if (!customAlias) {
                customAlias = Math.random().toString(36).substring(2, 8);
            }

            try {
                const checkRes = await fetch(`${DB_URL}/links/${customAlias}.json`);
                if (checkRes.ok) {
                    const existing = await checkRes.json();
                    if (existing && existing.originalUrl) {
                        errorMsg.style.display = 'block';
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Encurtar Link';
                        return;
                    }
                }

                const finalShortUrl = currentDomain + '?l=' + customAlias;

                // Salva informações completas para o Administrador analisar
                const saveRes = await fetch(`${DB_URL}/links/${customAlias}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        originalUrl: longUrl,
                        createdAt: Date.now(),
                        userId: localUserId,
                        clicks: 0,
                        blocked: false
                    })
                });

                if (!saveRes.ok) {
                    alert('Erro ao salvar o link.');
                    return;
                }

                // Salva localmente para exibir histórico PRIVADO ao usuário
                saveToLocalHistory(customAlias, longUrl);

                const shortDisplay = document.getElementById('shortUrlDisplay');
                shortDisplay.textContent = finalShortUrl;
                shortDisplay.href = finalShortUrl;
                document.getElementById('resultArea').style.display = 'block';

                document.getElementById('longUrl').value = '';
                document.getElementById('customAlias').value = '';
                loadLocalHistory();

            } catch (err) {
                alert('Erro de conexão ao tentar salvar o link.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Encurtar Link';
            }
        });

        function copyLink() {
            const shortUrl = document.getElementById('shortUrlDisplay').textContent;
            navigator.clipboard.writeText(shortUrl).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'Copiado!';
                setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 2000);
            });
        }

        function saveToLocalHistory(alias, originalUrl) {
            let userLinks = JSON.parse(localStorage.getItem('nexus_my_links') || '[]');
            userLinks.unshift({ alias, originalUrl });
            userLinks = userLinks.slice(0, 5); // guarda os 5 últimos
            localStorage.setItem('nexus_my_links', JSON.stringify(userLinks));
        }

        function loadLocalHistory() {
            const historyList = document.getElementById('historyList');
            const userLinks = JSON.parse(localStorage.getItem('nexus_my_links') || '[]');

            if (userLinks.length === 0) {
                historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">Nenhum link criado ainda por você neste navegador.</p>';
                return;
            }

            historyList.innerHTML = '';
            userLinks.forEach(item => {
                const fullShort = currentDomain + '?l=' + item.alias;
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div class="history-details">
                        <a href="${fullShort}" target="_blank" class="history-short">${fullShort}</a>
                        <span class="history-long">${item.originalUrl}</span>
                    </div>
                    <button class="btn-copy" style="border-color: var(--border); color: var(--text-muted);" onclick="navigator.clipboard.writeText('${fullShort}')">Copiar</button>
                `;
                historyList.appendChild(li);
            });
        }

        loadLocalHistory();
    </script>
</body>
</html>
