<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | Encurtador de Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #14161c;
            --input-bg: #1b1e26;
            --border: rgba(255, 255, 255, .09);
            --text-main: #f4f5f7;
            --text-muted: #8b93a1;
            --accent: #22e07a;
            --accent-hover: #3bf08e;
            --error: #f87171;
            --success: #22e07a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background:
                radial-gradient(circle at 15% -10%, rgba(34, 224, 122, .10), transparent 45%),
                radial-gradient(circle at 90% 15%, rgba(79, 140, 255, .08), transparent 45%),
                var(--bg-color);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #redirectScreen {
            display: none;
            text-align: center;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(34, 224, 122, .25);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 520px;
            animation: fadeUp .5s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-weight: 800;
            font-size: 2.1rem;
            letter-spacing: -1px;
        }

        header h1 span {
            background: linear-gradient(92deg, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
        }

        header p {
            color: var(--text-muted);
            font-size: .9rem;
            margin-top: 6px;
        }

        .card {
            background: linear-gradient(165deg, var(--card-bg), #101218);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, .55);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: .72rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: .95rem;
            transition: all .2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34, 224, 122, .15);
        }

        input::placeholder { color: #5b636f; }

        .input-prefix-container {
            display: flex;
            align-items: center;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color .2s, box-shadow .2s;
        }

        .input-prefix-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34, 224, 122, .15);
        }

        .prefix {
            padding-left: 14px;
            color: var(--text-muted);
            font-size: .82rem;
            white-space: nowrap;
            font-family: monospace;
        }

        .input-prefix-container input {
            border: none;
            background: transparent;
            padding-left: 6px;
            box-shadow: none !important;
        }

        button.btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #0fbd61);
            color: #04130a;
            border: none;
            padding: 15px;
            border-radius: 999px;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform .18s ease, box-shadow .25s ease;
            margin-top: 8px;
            box-shadow: 0 8px 22px rgba(34, 224, 122, .3);
            font-family: inherit;
        }

        button.btn-primary:hover {
            box-shadow: 0 12px 28px rgba(34, 224, 122, .45);
        }

        button.btn-primary:active { transform: scale(.97); }

        button.btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-area {
            margin-top: 24px;
            display: none;
            animation: fadeUp .35s ease;
        }

        .result-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(34, 224, 122, .08);
            border: 1px solid rgba(34, 224, 122, .28);
            padding: 14px 16px;
            border-radius: 14px;
            gap: 12px;
        }

        .short-url {
            color: var(--success);
            font-weight: 600;
            text-decoration: none;
            font-size: .88rem;
            word-break: break-all;
        }

        .btn-copy {
            background: transparent;
            border: 1px solid var(--success);
            color: var(--success);
            padding: 9px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: .78rem;
            font-weight: 700;
            white-space: nowrap;
            font-family: inherit;
            transition: all .2s;
        }

        .btn-copy:hover {
            background: var(--success);
            color: #04130a;
        }

        .btn-copy:active { transform: scale(.94); }

        .msg-erro {
            color: var(--error);
            font-size: .82rem;
            margin-top: 8px;
            display: none;
        }

        .history {
            margin-top: 34px;
        }

        .history h3 {
            font-size: .75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            background: linear-gradient(165deg, var(--card-bg), #101218);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            transition: border-color .2s, transform .2s;
        }

        .history-item:hover {
            border-color: rgba(34, 224, 122, .3);
            transform: translateY(-2px);
        }

        .history-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .history-short {
            color: var(--accent);
            text-decoration: none;
            font-size: .85rem;
            font-weight: 600;
            word-break: break-all;
        }

        .history-long {
            color: var(--text-muted);
            font-size: .78rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- Tela de Redirecionamento -->
    <div id="redirectScreen">
        <div class="spinner"></div>
        <h2 id="redirectMsg" style="font-weight: 500; font-size: 1.1rem;">Redirecionando...</h2>
    </div>

    <!-- Interface Principal do Usuário -->
    <div class="container" id="mainContainer">
        <header>
            <h1>NEXUS<span>Links</span></h1>
            <p>Encurtador de links profissional</p>
        </header>

        <div class="card">
            <form id="shortenForm">
                <div class="form-group">
                    <label for="longUrl">URL Original</label>
                    <input type="url" id="longUrl" placeholder="https://seu-link-original.com/pagina" required>
                </div>

                <div class="form-group">
                    <label for="customAlias">Nome Personalizado (Opcional)</label>
                    <div class="input-prefix-container">
                        <span class="prefix" id="domainPrefix">.../?l=</span>
                        <input type="text" id="customAlias" placeholder="meu-nome">
                    </div>
                    <div id="errorMsg" class="msg-erro">Este nome personalizado já está em uso ou foi bloqueado!</div>
                </div>

                <button type="submit" class="btn-primary" id="btnSubmit">Encurtar Link</button>
            </form>

            <div class="result-area" id="resultArea">
                <label style="display:block; margin-bottom:8px; font-size:0.8rem; color:var(--text-muted);">SEU LINK ENCURTADO:</label>
                <div class="result-box">
                    <a href="#" target="_blank" class="short-url" id="shortUrlDisplay"></a>
                    <button class="btn-copy" id="copyBtn" onclick="copyLink()">Copiar</button>
                </div>
            </div>
        </div>

        <div class="history">
            <h3>Seus Links Recentes</h3>
            <ul class="history-list" id="historyList">
                <p style="color: var(--text-muted); font-size: 0.85rem;">Nenhum link criado ainda por você neste navegador.</p>
            </ul>
        </div>
    </div>

    <script>
        const DB_URL = "https://meu-encurtador-e5878-default-rtdb.firebaseio.com";
        const currentDomain = window.location.origin + '/';
        document.getElementById('domainPrefix').textContent = window.location.hostname + '/?l=';

        // Identificador local do dispositivo do usuário (para registrar quem criou)
        let localUserId = localStorage.getItem('nexus_user_id');
        if (!localUserId) {
            localUserId = 'user_' + Math.random().toString(36).substring(2, 10);
            localStorage.setItem('nexus_user_id', localUserId);
        }

        // REDIRECIONAMENTO
        const urlParams = new URLSearchParams(window.location.search);
        const aliasParam = urlParams.get('l');

        if (aliasParam) {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('redirectScreen').style.display = 'block';

            fetch(`${DB_URL}/links/${aliasParam.toLowerCase()}.json`)
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data && data.originalUrl && !data.blocked) {
                        // Incrementa cliques se o link for válido
                        const clicks = (data.clicks || 0) + 1;
                        fetch(`${DB_URL}/links/${aliasParam.toLowerCase()}/clicks.json`, {
                            method: 'PUT',
                            body: JSON.stringify(clicks)
                        });
                        window.location.href = data.originalUrl;
                    } else if (data && data.blocked) {
                        document.querySelector('.spinner').style.display = 'none';
                        document.getElementById('redirectMsg').textContent = 'Este link foi suspenso por violar os termos de uso.';
                    } else {
                        document.querySelector('.spinner').style.display = 'none';
                        document.getElementById('redirectMsg').textContent = 'Link não encontrado!';
                    }
                })
                .catch(() => {
                    document.querySelector('.spinner').style.display = 'none';
                    document.getElementById('redirectMsg').textContent = 'Erro de conexão com o servidor.';
                });
        }

        // ENCURTAR LINK
        document.getElementById('shortenForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const longUrl = document.getElementById('longUrl').value.trim();
            let customAlias = document.getElementById('customAlias').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');
            const errorMsg = document.getElementById('errorMsg');

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Encurtando...';
            errorMsg.style.display = 'none';

            if (!customAlias) {
                customAlias = Math.random().toString(36).substring(2, 8);
            }

            try {
                const checkRes = await fetch(`${DB_URL}/links/${customAlias}.json`);
                if (checkRes.ok) {
                    const existing = await checkRes.json();
                    if (existing && existing.originalUrl) {
                        errorMsg.style.display = 'block';
                        btnSubmit.disabled = false;
                        btnSubmit.textContent = 'Encurtar Link';
                        return;
                    }
                }

                const finalShortUrl = currentDomain + '?l=' + customAlias;

                // Salva informações completas para o Administrador analisar
                const saveRes = await fetch(`${DB_URL}/links/${customAlias}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        originalUrl: longUrl,
                        createdAt: Date.now(),
                        userId: localUserId,
                        clicks: 0,
                        blocked: false
                    })
                });

                if (!saveRes.ok) {
                    alert('Erro ao salvar o link.');
                    return;
                }

                // Salva localmente para exibir histórico PRIVADO ao usuário
                saveToLocalHistory(customAlias, longUrl);

                const shortDisplay = document.getElementById('shortUrlDisplay');
                shortDisplay.textContent = finalShortUrl;
                shortDisplay.href = finalShortUrl;
                document.getElementById('resultArea').style.display = 'block';

                document.getElementById('longUrl').value = '';
                document.getElementById('customAlias').value = '';
                loadLocalHistory();

            } catch (err) {
                alert('Erro de conexão ao tentar salvar o link.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Encurtar Link';
            }
        });

        function copyLink() {
            const shortUrl = document.getElementById('shortUrlDisplay').textContent;
            navigator.clipboard.writeText(shortUrl).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'Copiado!';
                setTimeout(() => { copyBtn.textContent = 'Copiar'; }, 2000);
            });
        }

        function saveToLocalHistory(alias, originalUrl) {
            let userLinks = JSON.parse(localStorage.getItem('nexus_my_links') || '[]');
            userLinks.unshift({ alias, originalUrl });
            userLinks = userLinks.slice(0, 5); // guarda os 5 últimos
            localStorage.setItem('nexus_my_links', JSON.stringify(userLinks));
        }

        function loadLocalHistory() {
            const historyList = document.getElementById('historyList');
            const userLinks = JSON.parse(localStorage.getItem('nexus_my_links') || '[]');

            if (userLinks.length === 0) {
                historyList.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">Nenhum link criado ainda por você neste navegador.</p>';
                return;
            }

            historyList.innerHTML = '';
            userLinks.forEach(item => {
                const fullShort = currentDomain + '?l=' + item.alias;
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div class="history-details">
                        <a href="${fullShort}" target="_blank" class="history-short">${fullShort}</a>
                        <span class="history-long">${item.originalUrl}</span>
                    </div>
                    <button class="btn-copy" style="border-color: var(--border); color: var(--text-muted);" onclick="navigator.clipboard.writeText('${fullShort}')">Copiar</button>
                `;
                historyList.appendChild(li);
            });
        }

        loadLocalHistory();
    </script>
</body>
</html>
